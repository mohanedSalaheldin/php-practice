<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tailwind Demo</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

  <!-- Navbar -->
  <nav class="bg-gray-900 text-white py-4">
    <div class="max-w-6xl mx-auto px-4">
      <h1 class="text-xl font-semibold">My Store</h1>
    </div>
  </nav>

  <!-- Hero Section -->
  <div class="max-w-6xl mx-auto mt-8 px-4">
    <div class="p-8 bg-white rounded-2xl shadow text-center">
      <h1 class="text-3xl font-bold mb-2">Welcome to My Store</h1>
      <p class="text-gray-600">Best products, best prices!</p>
    </div>
  </div>

  <!-- Products -->
  <div class="max-w-6xl mx-auto mt-10 grid grid-cols-1 md:grid-cols-3 gap-6 px-4">

    <div class="bg-white rounded-xl shadow border">
      <img src="https://via.placeholder.com/300" class="w-full rounded-t-xl">
      <div class="p-4">
        <h3 class="text-xl font-semibold">Product 1</h3>
        <p class="text-gray-600 my-2">Description about product 1.</p>
        <a href="#" class="block text-center bg-blue-600 text-white py-2 rounded-lg">Buy</a>
      </div>
    </div>

    <div class="bg-white rounded-xl shadow border">
      <img src="https://via.placeholder.com/300" class="w-full rounded-t-xl">
      <div class="p-4">
        <h3 class="text-xl font-semibold">Product 2</h3>
        <p class="text-gray-600 my-2">Description about product 2.</p>
        <a href="#" class="block text-center bg-blue-600 text-white py-2 rounded-lg">Buy</a>
      </div>
    </div>

    <div class="bg-white rounded-xl shadow border">
      <img src="https://via.placeholder.com/300" class="w-full rounded-t-xl">
      <div class="p-4">
        <h3 class="text-xl font-semibold">Product 3</h3>
        <p class="text-gray-600 my-2">Description about product 3.</p>
        <a href="#" class="block text-center bg-blue-600 text-white py-2 rounded-lg">Buy</a>
      </div>
    </div>

  </div>

  <!-- Footer -->
  <footer class="bg-gray-900 text-white text-center py-4 mt-10">
    © 2025 My Store
  </footer>

</body>
</html>
